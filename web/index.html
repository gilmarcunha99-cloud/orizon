<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orizon Pass — Entrar</title>
  <meta name="description" content="Orizon Pass: acesso à plataforma de eventos esportivos Orizon Sports.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/assets/logo-orizon-sports.svg" alt="Orizon Sports">
      <span>Pass</span>
    </div>

    <form id="form-entrar" class="card-form" novalidate style="display:contents">
      <div class="group">
        <label for="email">E-mail</label>
        <div class="field" id="field-email">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C7A7A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com">
        </div>
      </div>

      <div class="group">
        <label for="senha">Senha</label>
        <div class="field has-btn" id="field-senha">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C7A7A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha">
          <button type="button" class="icon-btn" data-toggle-password="senha" aria-label="Mostrar senha">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p id="erro-login" class="msg-error hidden" role="alert">Preencha e-mail e senha.</p>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" name="manter"> Manter conectado</label>
        <a href="#esqueci" class="link-strong">Esqueci minha senha</a>
      </div>

      <button type="submit" id="btn-entrar" class="btn btn-primary">Entrar
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E48519" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
      <div id="login-ok" class="status-ok hidden" role="status">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B7A4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
        Login feito (protótipo)
      </div>
    </form>

    <div class="divider">ou</div>

    <a class="btn btn-secondary" href="/primeiro-acesso">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.5 3-6 7-6"/><path d="M18 14v6"/><path d="M15 17h6"/></svg>
      Primeiro acesso
    </a>

    <p class="legal">Ao entrar, você concorda com os <a href="#termos">Termos de uso</a> e a <a href="#privacidade">Política de privacidade</a>.</p>
    <p class="version">Versão 1.0.0</p>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
